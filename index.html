<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CMC LEARN - Gestion des Entreprises</title>
  <style>
    :root {
      --primary: #0f766e;
      --primary-dark: #115e59;
      --accent: #10b981;
      --bg: #f4f7f6;
      --card: #ffffff;
      --text: #1e293b;
      --muted: #64748b;
      --border: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      padding-bottom: 85px;
    }

    header {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 14px 18px;
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-box {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: var(--primary);
      color: #fff;
      display: grid;
      place-items: center;
      font-weight: 700;
      font-size: 16px;
    }

    .brand-title {
      font-weight: 700;
      font-size: 17px;
      color: var(--primary-dark);
    }

    .brand-sub {
      font-size: 11px;
      color: var(--muted);
    }

    .lang-btn {
      border: 1px solid var(--border);
      background: #f8fafc;
      color: var(--text);
      padding: 7px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .container {
      max-width: 780px;
      margin: 0 auto;
      padding: 16px;
    }

    .hero {
      background: linear-gradient(135deg, var(--primary-dark), #15803d);
      color: #fff;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 8px 24px rgba(15, 118, 110, 0.16);
    }

    .badge {
      display: inline-block;
      background: rgba(255, 255, 255, 0.18);
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 11px;
      margin-bottom: 10px;
    }

    .hero h1 {
      font-size: 21px;
      margin-bottom: 6px;
    }

    .hero p {
      font-size: 13.5px;
      opacity: 0.92;
      margin-bottom: 14px;
      line-height: 1.5;
    }

    .search-box {
      display: flex;
      gap: 8px;
      background: #fff;
      padding: 6px;
      border-radius: 12px;
    }

    .search-box input {
      flex: 1;
      border: none;
      outline: none;
      padding: 8px 10px;
      font-size: 14px;
      color: var(--text);
      background: transparent;
    }

    .section-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    @media (max-width: 520px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 15px;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      border-top: 4px solid var(--accent);
    }

    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(15, 23, 42, 0.06);
    }

    .card-icon {
      font-size: 24px;
      margin-bottom: 8px;
    }

    .card-title {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .card-desc {
      font-size: 12.5px;
      color: var(--muted);
      line-height: 1.4;
      margin-bottom: 10px;
    }

    .card-meta {
      font-size: 11.5px;
      color: var(--primary);
      font-weight: 600;
    }

    .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      margin-top: 14px;
      display: none;
    }

    .panel.active {
      display: block;
    }

    .lesson-item {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      margin-top: 10px;
      background: #fafafa;
    }

    .lesson-item h4 {
      font-size: 14px;
      margin-bottom: 4px;
    }

    .lesson-item p {
      font-size: 12.5px;
      color: var(--muted);
      line-height: 1.45;
    }

    .btn-secondary {
      margin-top: 12px;
      background: #e2e8f0;
      color: var(--text);
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--card);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      padding: 8px 6px;
      z-index: 20;
    }

    .nav-btn {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 11px;
      font-weight: 600;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      cursor: pointer;
      padding: 4px 10px;
      border-radius: 10px;
    }

    .nav-btn.active {
      color: var(--primary);
      background: #f0fdfa;
    }

    .empty {
      text-align: center;
      padding: 24px 12px;
      color: var(--muted);
      font-size: 13.5px;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="logo-box">CMC</div>
      <div>
        <div class="brand-title">CMC LEARN</div>
        <div class="brand-sub" id="headerSub">Gestion des Entreprises</div>
      </div>
    </div>
    <button class="lang-btn" id="langToggle" onclick="toggleLang()">العربية</button>
  </header>

  <main class="container">
    <section class="hero">
      <div class="badge" id="heroBadge">Espace Étudiants • Cours & Résumés</div>
      <h1 id="heroTitle">Bienvenue sur CMC LEARN</h1>
      <p id="heroDesc">Cours, résumés, PDF et examens — CMC Gestion des Entreprises.</p>
      <div class="search-box">
        <input
          type="text"
          id="searchInput"
          placeholder="Rechercher une matière, une leçon..."
          oninput="renderSubjects()"
        />
      </div>
    </section>

    <section id="homeView">
      <div class="section-title" id="subjectsTitle">Matières</div>
      <div class="grid" id="subjectsGrid"></div>
    </section>

    <section class="panel" id="detailPanel">
      <h2 id="detailTitle" style="font-size:17px;"></h2>
      <p id="detailDesc" style="font-size:13px;color:var(--muted);margin-top:4px;"></p>
      <div id="lessonsList"></div>
      <button class="btn-secondary" id="backBtn" onclick="closeDetail()">Retour</button>
    </section>
